name: hermes-federated-search
version: 1.1.1
manifest_version: 2
description: "Federated search — aggregate results from multiple search backends (Tavily, SearXNG, custom HTTP endpoints, etc.) with optional LLM-based relevance ranking and per-line multi-card credential pools. Configure via Settings → Plugins (card editor + Agent settings) or by editing the string (docs/agent-config.md)."
author: kumaxs
license: Apache-2.0
homepage: https://github.com/kumaxs/hermes-federated-search
requires_hermes: ">=0.21.5"
tags:
  - web-search
  - search
  - federated
kind: backend
provides_web_providers:
  - federated
config_schema:
  backends:
    type: list
    default: []
    label: 线路列表
    description: "数组，元素为主机配置对象（name / type / base_url / api_key_env / credentials / required 等）"
  timeout:
    type: int
    default: 10
    label: 超时（秒）
    description: "等全部线路返回的总时限；到期未返回的线路丢弃、已返回的线路凑部分结果"
  max_results:
    type: int
    default: 8
    label: 输出条数
    description: "排序后返回的最大条数（实际输出 = min(limit, max_results)）"
  min_backends:
    type: int
    default: 1
    label: 最少成功线路
    description: "本次「有结果返回」的线路数须 ≥N，不足则整次搜索失败；required 线路必须成功（1 ≤ N ≤ 线路数）"
  ranking_mode:
    type: str
    choices: [auto, keyword, llm]
    default: auto
    label: 排序方式
    description: "auto=按 ranker 配置（未配置→关键词；配置→LLM＋失败回退关键词）；keyword=强制关键词；llm=强制 LLM（ranker.provider 未配时用默认辅助模型）"
  pool_strategy:
    type: str
    choices: [fill_first, round_robin, random]
    default: fill_first
    label: 多卡使用策略（缺省全局）
    description: "全局缺省轮换策略：线路卡内未给 pool_strategy 时生效（卡片界面已移入每条线路卡）"
  ranker:
    type: dict
    default: {}
    label: LLM 排序（ranker）
    description: "provider/model 由卡片界面菜单写入；prompt 等既有键原样保留；重排序请求固定设置 reasoning_effort=off（关闭模型思考）"
